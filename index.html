<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="六月">
<meta name="theme-color" content="#FFF6F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>六月的小本子</title>
<style>
:root{
  --ink:#3B2D3A; --sub:#A3909D; --line:#F6E8EC; --bg:#FFF6F7; --card:#FFFFFF;
  --peach:#FDEAE1; --pink:#FF8FAB; --pink2:#FFD3DE; --sun:#FFD45E; --sun2:#FFF1C2; --sky:#8CC2FF; --sky2:#DCEBFF; --mint:#7EDDB6; --mint2:#DDF6EB; --lilac:#C3B2FF; --lilac2:#EEE8FF;
  --r:28px; --sh:0 5px 0 #F6E3E8;
  --round: ui-rounded,"SF Pro Rounded","PingFang SC",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--round);color:var(--ink);min-height:100vh;background:#FFEFF3;display:flex;align-items:center;justify-content:center;gap:60px;padding:32px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.6}
body:before{width:520px;height:520px;background:#FFE58A;left:-140px;top:-160px}
body:after{width:560px;height:560px;background:#BFDBFF;right:-180px;bottom:-220px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block}
svg{display:block}

.intro{width:300px}
.intro .logo{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:900}
.intro .logo img{width:64px;height:64px;border-radius:20px;transform:rotate(-6deg);box-shadow:0 6px 0 #F6D4DC}
.intro p{color:#7A6876;font-size:14px;line-height:1.8;margin:18px 0}
.intro .qr{background:var(--ink);color:#fff;border-radius:20px;padding:16px;font-size:13px;line-height:1.7}
.intro .qr b{color:var(--sun)}

.phone{width:390px;height:844px;border-radius:56px;position:relative;overflow:hidden;flex:none;
  background-color:var(--bg);background-image:radial-gradient(#FBE3E9 1.6px,transparent 1.6px);background-size:22px 22px;
  box-shadow:0 0 0 10px #fff,0 0 0 11px #F3D9E0,0 40px 80px -20px rgba(140,60,90,.3)}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font-size:15px;font-weight:700;z-index:30;background:linear-gradient(var(--bg) 60%,transparent)}
.status .notch{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#111}
.screen{position:absolute;inset:0;overflow-y:auto;padding:58px 20px 130px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.page{display:none;animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
.page.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:520px){
  body{display:block;padding:0;background:var(--bg)}
  body:before,body:after,.intro,.status{display:none}
  .phone{position:fixed;inset:0;width:auto;height:auto;border-radius:0;box-shadow:none}
  .screen{padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:calc(env(safe-area-inset-bottom) + 120px)}
  .tabbar{bottom:calc(env(safe-area-inset-bottom) + 10px)!important}
  .sheet{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)!important}
  .toast{top:calc(env(safe-area-inset-top) + 12px)!important}
}

.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px;gap:10px}
.top h1{font-size:27px;font-weight:900}
.top small{display:block;color:var(--sub);font-size:13px;font-weight:700;margin-bottom:2px}
.iconbtn{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;position:relative;box-shadow:var(--sh);flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #F6E3E8}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px}
.sec h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:6px}
.sec button{font-size:13px;color:var(--sub);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.num{font-variant-numeric:tabular-nums}

.hero{background:var(--peach);border-radius:34px;position:relative;overflow:hidden;box-shadow:0 6px 0 #F7CFC4;margin-bottom:16px}
.hero .pic{position:absolute;right:-18px;top:-6px;width:205px;height:205px;cursor:pointer}
.hero .pic img{width:100%;height:100%;object-fit:cover}
.hero .pic.jump{animation:jump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:scale(1.03,.97)}}
.hero .info{position:relative;padding:22px 20px 0;min-height:186px}
.hero h2{font-size:42px;font-weight:900;line-height:1;letter-spacing:2px}
.hero .tags{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:12px}
.hero .tags span{background:#fff;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px}
.hero .motto{font-size:12px;font-weight:700;color:#B57E85;margin-top:12px;max-width:150px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px;position:relative}
.stats div{background:#fff;border-radius:20px;padding:10px 6px 9px;text-align:center}
.stats b{font-size:21px;font-weight:900;display:block;line-height:1.15}
.stats b small{font-size:11px;font-weight:800;margin-left:1px}
.stats span{font-size:11px;color:var(--sub);font-weight:700}
.bubble{position:absolute;right:150px;top:150px;background:#fff;border-radius:16px 16px 4px 16px;padding:7px 11px;font-size:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:3}
.bubble.on{opacity:1;transform:translateY(-6px)}
.heart{position:absolute;z-index:5;pointer-events:none;animation:heart 1s ease-out forwards}
@keyframes heart{to{transform:translateY(-70px) scale(1.4);opacity:0}}

.banner{display:flex;align-items:center;gap:12px;background:var(--pink);color:#fff;border-radius:26px;padding:14px 16px;margin-bottom:14px;box-shadow:0 5px 0 #EE7393}
.banner .ic{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;flex:none;transform:rotate(-8deg);font-size:24px}
.banner p{flex:1;font-size:15px;font-weight:900}
.banner p small{display:block;font-size:12px;opacity:.9;font-weight:700;margin-top:2px}
.banner button{background:#fff;color:var(--ink);font-size:12px;font-weight:900;padding:9px 12px;border-radius:14px;flex:none}

.remind{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.remind:last-child{border:0;padding-bottom:0}
.remind:first-child{padding-top:0}
.blob{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;flex:none}
.remind .tx{flex:1;min-width:0}
.remind .tx b{font-size:16px;font-weight:900;display:block}
.remind .tx span{font-size:12px;color:var(--sub);font-weight:700}
.done{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border-radius:26px;padding:16px;cursor:pointer;position:relative;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.mini .lb{font-size:12px;font-weight:800;opacity:.6}
.mini .val{font-size:28px;font-weight:900;margin:4px 0}
.mini .val small{font-size:13px;margin-left:2px}

.moments,.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:4px 20px 10px;scrollbar-width:none}
.moments::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.mo{flex:none;width:132px;background:#fff;border-radius:22px;padding:12px;box-shadow:var(--sh);cursor:pointer;position:relative}
.mo .e{font-size:26px;line-height:1}
.mo b{display:block;font-size:13px;font-weight:900;margin-top:8px;line-height:1.4}
.mo span{display:block;font-size:11px;color:var(--sub);font-weight:700;margin-top:4px}
.mo i{position:absolute;right:10px;top:10px;font-style:normal;font-size:10px;font-weight:900;background:#FFE3E7;color:#FF2442;border-radius:6px;padding:2px 5px}
.strip{gap:12px}
.ph{flex:none;width:124px;cursor:pointer;background:#fff;border-radius:20px;padding:7px 7px 10px;box-shadow:var(--sh)}
.ph:nth-child(odd){transform:rotate(-2deg)}.ph:nth-child(even){transform:rotate(2deg)}
.ph .img{width:110px;height:136px;border-radius:14px;overflow:hidden;background:var(--line)}
.ph .img img{width:100%;height:100%;object-fit:cover}
.ph p{font-size:12px;font-weight:800;margin:7px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph span{font-size:11px;color:var(--sub);font-weight:700;margin-left:3px}
.xhs-card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:26px;padding:14px 16px;box-shadow:var(--sh);cursor:pointer}
.xhs-logo{width:46px;height:46px;border-radius:15px;background:#FF2442;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.xhs-card p{flex:1;font-weight:900;font-size:15px}
.xhs-card p small{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-top:3px;line-height:1.5}

.seg{display:flex;background:#fff;border-radius:20px;padding:5px;margin-bottom:16px;box-shadow:var(--sh)}
.seg button{flex:1;padding:10px 0;border-radius:15px;font-size:13px;font-weight:800;color:var(--sub);transition:.25s}
.seg button.on{background:var(--ink);color:#fff}
.compare-entry{background:var(--sky);color:#fff;border-radius:26px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 5px 0 #6FA9EE;margin-bottom:12px}
.compare-entry .pair{display:flex}
.compare-entry .pair img{width:54px;height:54px;border-radius:16px;object-fit:cover;border:3px solid #fff}
.compare-entry .pair img:first-child{transform:rotate(-8deg)}
.compare-entry .pair img+img{margin-left:-12px;transform:rotate(8deg)}
.compare-entry p{flex:1;font-weight:900;font-size:15px}
.compare-entry p small{display:block;font-weight:700;font-size:12px;opacity:.9;margin-top:3px}
.month{margin-bottom:22px}
.mhead{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.mhead .badge{width:56px;height:56px;border-radius:50%;background:var(--c);display:grid;place-items:center;text-align:center;font-size:17px;font-weight:900;line-height:1;transform:rotate(-8deg);border:3px solid #fff;box-shadow:0 3px 8px rgba(59,45,58,.1);flex:none}
.mhead .badge small{display:block;font-size:9px;font-weight:800;margin-top:2px;opacity:.7}
.mhead .t{flex:1}
.mhead b{font-size:15px;font-weight:900;display:block}
.mhead span{font-size:12px;color:var(--sub);font-weight:700}
.mhead button{font-size:12px;font-weight:900;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:var(--sh)}
.mstones{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px}
.mstones span{font-size:12px;font-weight:800;background:#fff;border-radius:10px;padding:5px 9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--line);cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .v{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center}
.tile .lk{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:900;color:#fff;background:rgba(0,0,0,.3);border-radius:8px;padding:2px 6px;display:flex;align-items:center;gap:2px}
.tile .mine{position:absolute;left:6px;top:6px;font-size:10px;font-weight:900;background:var(--sun);border-radius:7px;padding:2px 6px}
.empty{text-align:center;color:var(--sub);font-size:14px;font-weight:700;padding:30px 0}

.chart-card{background:#fff;border-radius:28px;padding:18px 18px 12px;box-shadow:var(--sh)}
.bigval{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bigval b{font-size:44px;font-weight:900}
.range{display:flex;gap:6px;margin:10px 0 4px}
.range button{font-size:12px;font-weight:800;padding:7px 13px;border-radius:12px;color:var(--sub);background:var(--bg)}
.range button.on{background:var(--sun);color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:2px dashed var(--line);font-size:14px;font-weight:700;gap:10px}
.row:last-child{border:0}
.row>span{color:var(--sub);font-size:13px;flex:none}
.care-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.care{background:#fff;border-radius:26px;padding:16px;position:relative;box-shadow:var(--sh)}
.care .ring{width:60px;height:60px;position:relative;margin-bottom:12px}
.care .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:900;text-align:center;line-height:1}
.care .ring span small{font-size:9px;display:block;color:var(--sub)}
.care b{font-size:16px;font-weight:900;display:block}
.care small{font-size:12px;color:var(--sub);display:block;margin-top:3px;font-weight:700;line-height:1.5}
.care>button{position:absolute;right:14px;top:14px;font-size:12px;font-weight:800;padding:7px 11px;border-radius:12px;background:var(--bg)}
.ill{background:#fff;border-radius:24px;padding:16px;margin-bottom:12px;display:flex;gap:12px;box-shadow:var(--sh)}
.ill .date{width:54px;flex:none;text-align:center;background:var(--bg);border-radius:16px;padding:8px 0;align-self:flex-start}
.ill .date b{font-size:18px;display:block;font-weight:900}
.ill .date span{font-size:11px;color:var(--sub);font-weight:700}
.ill .tx{flex:1;min-width:0}
.ill .tx b{font-size:15px;font-weight:900}
.ill .tx p{font-size:13px;color:#6E5C6B;margin-top:5px;line-height:1.65;font-weight:600}
.ill .tx a{display:inline-flex;margin-top:8px;font-size:12px;font-weight:900;color:#FF2442;gap:4px;align-items:center;cursor:pointer}
.bigbtn{width:100%;background:var(--ink);color:#fff;border-radius:20px;padding:16px;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;box-shadow:0 5px 0 #1E161D}
.bigbtn.light{background:#fff;color:var(--ink);box-shadow:var(--sh)}

.idcard{border-radius:30px;padding:20px;position:relative;overflow:hidden;background:var(--sky);box-shadow:0 6px 0 #6FA9EE}
.idcard .hd{display:flex;justify-content:space-between;font-size:12px;font-weight:900;letter-spacing:2px;color:#fff}
.idcard .bd{display:flex;gap:16px;margin-top:14px;align-items:center}
.idcard .av{width:100px;height:100px;border-radius:28px;overflow:hidden;flex:none;border:4px solid #fff;transform:rotate(-4deg)}
.idcard .av img{width:100%;height:100%;object-fit:cover}
.idcard h2{font-size:32px;font-weight:900;color:#fff}
.idcard .f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.idcard .f div{font-size:13px;font-weight:800;background:rgba(255,255,255,.75);border-radius:14px;padding:8px 10px}
.idcard .f span{display:block;font-size:11px;font-weight:700;opacity:.6;margin-bottom:1px}
.size{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size div{background:var(--sun2);border-radius:20px;padding:14px;text-align:center}
.size div:nth-child(2){background:var(--mint2)}
.size b{font-size:30px;font-weight:900}
.size b small{font-size:13px}
.size span{display:block;font-size:12px;font-weight:800;color:#8A7A86}
.avoid{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px dashed var(--line);cursor:pointer}
.avoid:last-child{border:0}
.avoid i{font-style:normal;font-size:22px}
.avoid b{font-size:15px;font-weight:900;display:block}
.avoid span{font-size:12px;color:var(--sub);font-weight:700}
.list .row{cursor:pointer}
.cloud{display:flex;align-items:center;gap:12px}
.cloud .st{width:12px;height:12px;border-radius:50%;flex:none}

.tabbar{position:absolute;left:14px;right:14px;bottom:24px;height:74px;border-radius:30px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-around;z-index:40;box-shadow:0 6px 0 #F4DDE3,0 14px 30px -10px rgba(140,60,90,.2)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#C2B1BC;width:58px}
.tab i{width:44px;height:32px;border-radius:13px;display:grid;place-items:center;transition:.3s cubic-bezier(.3,1.6,.5,1)}
.tab.on{color:var(--ink)}
.tab.on i{background:var(--pink2);transform:translateY(-2px)}
.tab.on svg{stroke:var(--ink)}
.fab{width:60px;height:60px;border-radius:22px;background:var(--sun);display:grid;place-items:center;margin-top:-30px;border:4px solid #fff;box-shadow:0 5px 0 #E8B93A}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 #E8B93A}

.mask{position:absolute;inset:0;background:rgba(59,45,58,.35);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;z-index:60;padding:10px 22px 34px;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,1.1,.3,1);max-height:92%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#F0DDE3;margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:900;margin-bottom:6px}
.sheet .hint{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:16px;line-height:1.6}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.types button{border-radius:22px;padding:16px 6px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:900}
.types button span{font-size:28px;line-height:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:0;background:var(--bg);border-radius:16px;padding:13px 14px;font-size:16px;font-weight:700;outline:none}
.field textarea{min-height:80px;resize:none}
.field input:focus,.field textarea:focus{box-shadow:0 0 0 2.5px var(--pink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{padding:9px 14px;border-radius:14px;background:var(--bg);font-size:13px;font-weight:800}
.pills button.on{background:var(--ink);color:#fff}
.submit{width:100%;background:var(--ink);color:#fff;border-radius:20px;padding:16px;font-weight:900;font-size:16px;margin-top:6px;box-shadow:0 5px 0 #1E161D}
.submit.light{background:var(--bg);color:var(--ink);box-shadow:0 5px 0 #F2DDE3;margin-top:12px}
.upload{border:3px dashed #F2D2DB;border-radius:26px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;text-align:center;background:var(--bg)}
.upload b{color:var(--ink);font-size:16px;font-weight:900}
.upload img{width:84px;height:84px;border-radius:24px}
.kg{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:10px 0 18px}
.kg input{width:180px;text-align:center;font-size:56px;font-weight:900;border:0;outline:none;background:none}
.kg span{font-size:18px;font-weight:900;color:var(--sub)}
.det{background:var(--bg);border-radius:24px;padding:12px;margin-bottom:12px;display:flex;gap:12px}
.det .th{width:86px;height:110px;border-radius:16px;overflow:hidden;flex:none}
.det .th img{width:100%;height:100%;object-fit:cover}
.det .bd{flex:1;min-width:0}
.det .src{font-size:11px;font-weight:800;display:inline-block;padding:3px 8px;border-radius:8px}
.det .age{font-size:20px;font-weight:900;margin:5px 0 2px}
.det .ex{font-size:12px;color:#6E5C6B;font-weight:700;line-height:1.5}
.det .warn{font-size:12px;color:#E9573A;font-weight:800;margin-top:3px}
.det .ed{display:flex;gap:6px;margin-top:8px}

function dbDel(k){return new Promise(res=>{if(!db)return res();const t=db.transaction('photos','readwrite');t.objectStore('photos').delete(k);t.oncomplete=res;t.onerror=res})}

function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const days=(a,b)=>Math.round((b-a)/864e5);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x};
const md=s=>{const d=typeof s==='string'?P(s):s;return `${d.getMonth()+1}月${d.getDate()}日`};
const ymd=s=>s.replace(/-/g,'.');
function monthsBetween(a,b){let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return m}
function ageOf(s){const b=P(S.dog.birthday),d=typeof s==='string'?P(s):s;const m=monthsBetween(b,d);return {m,d:days(addMonths(b,m),d)}}
function ageText(s,withDays){const {m,d}=ageOf(s);if(m<0)return '出生前';const y=Math.floor(m/12),r=m%12;let t=y?`${y}岁${r?r+'个月':''}`:`${r}个月`;if(withDays&&d)t+=`${d}天`;return t}
const sortDesc=a=>[...a].sort((x,y)=>P(y.date)-P(x.date));
const sortAsc=a=>[...a].sort((x,y)=>P(x.date)-P(y.date));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kgText=k=>String(Math.round(k*100)/100);
const paw=(s=16,c='#3B2D3A')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><ellipse cx="12" cy="15.5" rx="4.6" ry="3.9"/><ellipse cx="6" cy="10.5" rx="2" ry="2.4"/><ellipse cx="9.6" cy="6.6" rx="2" ry="2.4"/><ellipse cx="14.4" cy="6.6" rx="2" ry="2.4"/><ellipse cx="18" cy="10.5" rx="2" ry="2.4"/></svg>`;
const heart=(s=12,c='#fff')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 21s-9-5.2-9-11.8A5 5 0 0 1 12 6.4a5 5 0 0 1 9 2.8C21 15.8 12 21 12 21z"/></svg>`;

function careStatus(){

}

}

/* ===== 图表 ===== */
function chart(data,W,H,{axis=true,color='#FF8FAB',marks=[]}={}){
  if(data.length<2)return '<div class="empty">记两次体重就能看到曲线</div>';
  const pad=axis?{l:30,r:14,t:18,b:24}:{l:4,r:6,t:8,b:4};
  const xs=data.map(d=>P(d.date).getTime()),ys=data.map(d=>+d.kg);
  let mn=Math.min(...ys),mx=Math.max(...ys);const sp=(mx-mn)||1;mn-=sp*.12;mx+=sp*.12;
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const X=t=>pad.l+(t-x0)/(x1-x0||1)*(W-pad.l-pad.r),Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(H-pad.t-pad.b);
  const pts=data.map(d=>[X(P(d.date).getTime()),Y(+d.kg)]);
  let path=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[c,d]=pts[i],m=(a+c)/2;path+=` C${m},${b} ${m},${d} ${c},${d}`}
  const id='g'+Math.random().toString(36).slice(2,7);
  let g='';
  if(axis){
    for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" stroke="#F6E8EC" stroke-width="2" stroke-dasharray="4 5"/><text x="0" y="${y+4}" font-size="10" font-weight="700" fill="#C2B1BC">${v.toFixed(1)}</text>`}
    for(const mk of marks){const t=P(mk.date).getTime();if(t<x0||t>x1)continue;const x=X(t);g+=`<line x1="${x}" x2="${x}" y1="${pad.t}" y2="${H-pad.b}" stroke="#FFD45E" stroke-width="2" stroke-dasharray="3 4"/><text x="${x}" y="${pad.t-5}" font-size="10" font-weight="900" fill="#C99A1E" text-anchor="middle">${mk.label}</text>`}
    const f=P(data[0].date),l=P(data[data.length-1].date);
    g+=`<text x="${pad.l}" y="${H-4}" font-size="10" font-weight="700" fill="#C2B1BC">${f.getMonth()+1}.${f.getDate()}</text><text x="${W-pad.r}" y="${H-4}" font-size="10" font-weight="700" fill="#C2B1BC" text-anchor="end">${l.getMonth()+1}.${l.getDate()}</text>`;
  }
  const last=pts[pts.length-1];
  return `<svg width="100%" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".4"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}
  <path d="${path} L${last[0]},${H-pad.b} L${pts[0][0]},${H-pad.b}Z" fill="url(#${id})"/>
  <path d="${path}" fill="none" stroke="${color}" stroke-width="${axis?4:3}" stroke-linecap="round"/>
  ${axis?pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')+`<g transform="translate(${last[0]-10} ${last[1]-10})">${paw(20)}</g>`:`<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"/>`}</svg>`;
}
function ring(p,color,size=60){
  const r=size/2-6,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(1,p)));
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#F6EEF1" stroke-width="9" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg>`;
}

function nextMilestone(){
  const b=P(S.dog.birthday),h=P(S.dog.home),list=[];
  for(let m=1;m<=36;m++){const d=addMonths(b,m);if(d>=TODAY){list.push({d,t:m%12===0?`${m/12} 岁生日`:`满 ${m} 个月`,e:m%12===0?'🎂':'🎉',month:m});break}}
  for(const [n,t] of [[100,'到家 100 天'],[200,'到家 200 天'],[365,'到家一周年'],[500,'到家 500 天']]){const d=addDays(h,n);if(d>=TODAY)list.push({d,t,e:'🏠'})}
  const hy=addMonths(h,6);if(hy>=TODAY)list.push({d:hy,t:'到家半年',e:'🏠'});
  return list.sort((x,y)=>x.d-y.d)[0];
}

function openReport(m){
  const b=P(S.dog.birthday),start=addMonths(b,m),end=addDays(addMonths(b,m+1),-1);

  const ps=allPhotos().filter(p=>inR(p.date)&&!p.textCover).sort((x,y)=>(y.likes||0)-(x.likes||0));
  const ws=sortAsc(live(S.weights)).filter(w=>inR(w.date));
  const mo=sortAsc(live(S.moments)).filter(x=>inR(x.date));
  const cr=sortAsc(live(S.care)).filter(x=>inR(x.date));
  const notes=xhsPhotos.filter(p=>inR(p.date));
  const lines=[`${S.dog.name} ${m} 个月（${md(start)}–${md(end)}）`];
  if(ws.length)lines.push(`体重：${kgText(ws[0].kg)}kg → ${kgText(ws[ws.length-1].kg)}kg`);

/* ===== 健康 ===== */
let healthTab='weight',wRange=0;
function setHealthTab(t){healthTab=t;renderHealth();document.getElementById('screen').scrollTop=0}
function renderHealth(){
  const ws=sortDesc(live(S.weights)),w=ws[0];
  let body='';
  if(healthTab==='weight'){
    const cut=wRange?addDays(TODAY,-wRange):new Date(0);
    const data=sortAsc(live(S.weights)).filter(x=>P(x.date)>=cut);
    const marks=[{date:fmt(addMonths(P(S.dog.birthday),6)),label:'半岁'}];
    const m30=w&&ws.find(x=>days(P(x.date),P(w.date))>=28);
    const first=sortAsc(live(S.weights))[0];
    const per=m30?(w.kg-m30.kg)/days(P(m30.date),P(w.date))*7:0;
    body=`<div class="chart-card">
      <div style="font-size:12px;color:var(--sub);font-weight:800">${w?md(w.date)+' · '+ageText(w.date,true):''}</div>
      <div class="bigval"><b class="num">${w?kgText(w.kg):'-'}</b><span style="font-weight:900">kg</span>${m30?`<span class="chip" style="background:var(--mint2);color:#1E9E6A">近一个月 ${w.kg-m30.kg>=0?'+':''}${(w.kg-m30.kg).toFixed(2)}</span>`:''}</div>
      <div class="range">${[[0,'全部'],[90,'三个月'],[30,'一个月']].map(([v,n])=>`<button class="${wRange===v?'on':''}" onclick="wRange=${v};renderHealth()">${n}</button>`).join('')}</div>
      ${chart(data,320,180,{marks})}
    </div>
    ${m30&&first?`<div class="card" style="margin-top:14px;background:var(--sky2);box-shadow:0 5px 0 #C4DCFA;font-size:13px;line-height:1.7;font-weight:700">
      ${md(m30.date)} 到 ${md(w.date)}，平均每周 ${per>=0?'+':''}${per.toFixed(2)} kg。${md(first.date)}第一次称是 ${kgText(first.kg)} kg，现在是那时的 ${(w.kg/first.kg).toFixed(1)} 倍。</div>`:''}
    <div class="sec"><h3>记录</h3><button onclick="openForm('weight')">+ 添加</button></div>
    <div class="card">${ws.map((x,i)=>{const p=ws[i+1],dd=p?x.kg-p.kg:0;return `<div class="row" onclick="editItem('weights','${x.id}')"><span>${ymd(x.date)} · ${ageText(x.date)}</span><div><b class="num">${kgText(x.kg)} kg</b><small style="color:${dd>0?'#1E9E6A':dd<0?'#FF6B4A':'#C2B1BC'};font-weight:900;margin-left:6px;font-size:12px">${p?(dd>0?'+':'')+dd.toFixed(2):''}</small></div></div>`}).join('')||'<div class="empty">还没有记录</div>'}</div>`;
  } else if(healthTab==='care'){
    const cs=careStatus();
    body=`<div class="care-grid">${cs.filter(c=>c.last).map(c=>{const w2=careWhen(c);const span=days(P(c.last.date),c.from)||1;const p=days(P(c.last.date),TODAY)/span;return `
      <div class="care"><div class="ring">${ring(p,c.left<=7?'#FF6B4A':c.t.color)}<span>${c.over>0?'!':Math.max(0,c.left)}${c.over>0?'':'<small>天</small>'}</span></div>
        <button onclick="openForm('care','${c.k}')">记一次</button>
        <b>${c.t.emoji} ${c.t.name}</b><small><span style="color:${w2.col};font-weight:900">${w2.txt}</span><br>${rangeText(c)}<br>每 ${c.mn===c.mx?(c.mn>=365?'年':c.mn+' 天'):c.mn+'–'+c.mx+' 天'}一次</small></div>`}).join('')}</div>
    ${cs.some(c=>!c.last)?`<div class="sec"><h3>还没开始记的</h3></div><div class="pills">${cs.filter(c=>!c.last).map(c=>`<button onclick="openForm('care','${c.k}')">${c.t.emoji} ${c.t.name}</button>`).join('')}</div>`:''}
    <div class="sec"><h3>历史记录</h3><button onclick="openCycle()">周期设置</button></div>
    <div class="card">${sortDesc(live(S.care)).map(c=>`<div class="row" onclick="editItem('care','${c.id}')"><div style="display:flex;gap:8px;align-items:center;min-width:0"><span style="font-size:18px">${CARE[c.type].emoji}</span><b>${CARE[c.type].name}</b><small style="color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.product||'')}</small></div><span>${ymd(c.date)}</span></div>`).join('')}</div>`;
  } else {
    body=`<button class="bigbtn" onclick="openSummary()">🩺 生成就医摘要</button>
    ${sortDesc(live(S.ill)).map(i=>{const d=P(i.date);const col=i.status==='观察中'?['#FFE4DA','#E9573A']:i.status==='已康复'?['#DDF6EB','#1E9E6A']:['#EEE8FF','#6E5BE0'];return `
      <div class="ill"><div class="date"><b>${d.getMonth()+1}/${d.getDate()}</b><span>${ageText(i.date)}</span></div>
      <div class="tx"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b>${esc(i.title)}</b><span class="chip" style="background:${col[0]};color:${col[1]};flex:none">${esc(i.status)}</span></div><p>${esc(i.note)}</p>
      <div style="display:flex;gap:14px">${i.xhs?`<a onclick="openXhs('${i.xhs}')">📕 小红书笔记</a>`:''}<a style="color:var(--sub)" onclick="editItem('ill','${i.id}')">编辑</a></div></div></div>`}).join('')}
    <button class="bigbtn light" onclick="openForm('ill')">+ 添加病历</button>`;
  }
  document.getElementById('p-health').innerHTML=`
  <div class="top"><div><small>${esc(S.dog.name)} · ${ageText(fmt(TODAY),true)}</small><h1>健康</h1></div>
    <button class="iconbtn" onclick="openSummary()" style="font-size:20px">🩺</button></div>
  <div class="seg">${[['weight','体重'],['care','驱虫疫苗'],['ill','病历']].map(([k,n])=>`<button class="${healthTab===k?'on':''}" onclick="setHealthTab('${k}')">${n}</button>`).join('')}</div>
  ${body}`;
}
function summaryText(){
  const d=S.dog,ws=sortDesc(live(S.weights)),il=sortDesc(live(S.ill)),ms=sortDesc(live(S.measures))[0];
  return [`【${d.name}】${d.variety||d.breed} · ${d.gender} · ${ageText(fmt(TODAY),true)}（${ymd(d.birthday)} 出生）${d.neuter?' · '+d.neuter:''}`,
  ws[0]?`体重：${kgText(ws[0].kg)} kg（${ymd(ws[0].date)}）${ws[3]?'，'+md(ws[3].date)+'为 '+kgText(ws[3].kg)+' kg':''}`:'体重：未记录',

function saveCycle(){for(const k of Object.keys(CARE)){const a=+val(`cy_${k}_0`),b=+val(`cy_${k}_1`);if(a>0)S.careCfg[k]=[a,Math.max(a,b||a)]}S.careCfg.u=now();save();closeSheet();renderAll();toast('周期已更新')}
function copyText(t,msg){
  const done=()=>toast(msg||'已复制');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}
}

function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const o=JSON.parse(r.result);if(!o.S||!o.S.dog)throw 0;S=mergeState(S,o.S);for(const[k,v]of Object.entries(o.photos||{})){await dbPut(k,v);photoCache[k]=v}save();renderAll();toast('已从备份恢复')}catch(e){toast('这个文件不是备份文件')}};
  r.readAsText(f);
}

function saveWeight(){const kg=parseFloat(val('fKg'));if(!(kg>0&&kg<60))return toast('体重好像不太对');upsert('weights',{date:val('fDate'),kg:Math.round(kg*100)/100});toast('体重记好了')}
function saveCare(){const t=pick.care;upsert('care',{type:t,date:val('fDate'),product:val('fProd'),note:val('fNote')});const c=careStatus().find(x=>x.k===t);toast(`下次${CARE[t].name}：${rangeText(c)}`)}
function saveIll(){if(!val('fTitle'))return toast('写一下症状或诊断');upsert('ill',{date:val('fDate'),title:val('fTitle'),note:val('fNote'),status:pick.status});toast('病历存好了')}
function saveMoment(){if(!val('fTitle'))return toast('写一下是什么第一次');upsert('moments',{date:val('fDate'),title:val('fTitle'),e:val('fE')||'⭐'});toast('记下来了')}
function saveMeasure(){const c=+val('fChest'),l=+val('fLen');if(!(c>0&&l>0))return toast('两个数都要填');upsert('measures',{date:val('fDate'),chest:c,length:l});toast('尺寸记好了')}
function saveAvoid(){if(!val('fTitle'))return toast('写一下名称');upsert('avoid',{name:val('fTitle'),e:val('fE'),note:val('fNote')});toast('记好了')}

/* ===== 读照片拍摄日期 ===== */
function exifDate(buf){
  try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;
    while(o<v.byteLength-10){const m=v.getUint16(o);if((m&0xFF00)!==0xFF00)return null;const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiffDate(v,o+10);if(m===0xFFDA)return null;o+=2+len}}catch(e){}
  return null;
}
function tiffDate(v,t){
  const le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
  const ifd=off=>{const n=g16(t+off),tags={};for(let i=0;i<n;i++){const e=t+off+2+i*12;tags[g16(e)]={count:g32(e+4),at:e+8}}return tags};
  const str=tag=>{if(!tag)return null;const p=tag.count>4?t+g32(tag.at):tag.at;let s='';for(let i=0;i<tag.count-1;i++)s+=String.fromCharCode(v.getUint8(p+i));return s};
  const i0=ifd(g32(t+4));let d=null;
  if(i0[0x8769]){const ex=ifd(g32(i0[0x8769].at));d=str(ex[0x9003])||str(ex[0x9004])}
  d=d||str(i0[0x0132]);const m=d&&d.match(/^(\d{4}):(\d{2}):(\d{2})/);return m&&+m[1]>1990?`${m[1]}-${m[2]}-${m[3]}`:null;
}
function nameDate(n){const m=n.match(/(20\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])/);return m?`${m[1]}-${m[2]}-${m[3]}`:null}
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const c=document.createElement('canvas'),sc=Math.min(1,1200/Math.max(im.width,im.height));c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}
async function handleFiles(files){
  const list=document.getElementById('detList');list.innerHTML='<div class="scanning">正在看照片是什么时候拍的…</div>';pending=[];
  for(const f of files){let date=null,source='none';
    try{date=exifDate(await f.slice(0,262144).arrayBuffer());if(date)source='exif'}catch(e){}
    if(!date){date=nameDate(f.name);if(date)source='name'}
    let src=null;try{src=await shrink(f)}catch(e){}
    if(!src){toast(`${f.name} 打不开`);continue}
    pending.push({src,date:date||fmt(TODAY),source,caption:''})}
  pending.sort((a,b)=>P(a.date)-P(b.date));renderPending();
}
const SRC={exif:['照片信息里读到的','#DDF6EB','#1E9E6A'],name:['从文件名里读到的','#DCEBFF','#3E7FD6'],none:['没读到，请选一下日期','#FFE4DA','#E9573A']};
function renderPending(){
  const list=document.getElementById('detList');if(!list)return;if(!pending.length){list.innerHTML='';return}
  list.innerHTML=`<div style="font-size:13px;font-weight:800;margin:0 2px 10px">${pending.length} 张，${pending.filter(p=>p.source!=='none').length} 张认出了日期</div>`+
  pending.map((p,i)=>{const s=SRC[p.source],a=ageOf(p.date),w=weightNear(p.date),d=P(p.date);
    const warn=d>TODAY?'日期在未来，改一下吧':a.m<0?'那时还没出生，日期对吗？':d<P(S.dog.home)?'这是到家之前的照片':'';
    return `<div class="det"><div class="th"><img src="${p.src}"></div><div class="bd">
      <span class="src" style="background:${s[1]};color:${s[2]}">${s[0]}</span>
      <div class="age">${ageText(p.date,true)}</div>
      <div class="ex">${ymd(p.date)}${w?` · 那时约 ${kgText(w.kg)} kg`:''}</div>${warn?`<div class="warn">${warn}</div>`:''}
      <div class="ed"><input type="date" value="${p.date}" onchange="pending[${i}].date=this.value;renderPending()"></div>
      <div class="ed"><input placeholder="写一句（可不写）" value="${esc(p.caption)}" oninput="pending[${i}].caption=this.value"></div>
    </div></div>`}).join('')+`<button class="submit" onclick="savePending()">放进相册</button>`;
}
async function savePending(){
  for(const p of pending){const id=uid('p');await dbPut(id,p.src);photoCache[id]=p.src;S.photos.push({id,u:now(),date:p.date,caption:p.caption||'新的一天'})}
  const n=pending.length;pending=[];save();closeSheet();growFilter='all';renderAll();go('grow');toast(`${n} 张照片已按月龄放好`);
}

/* ===== 云同步（Supabase） ===== */
// 建好 Supabase 项目后，把 Project URL 和 anon public key 填在这里，之后每台手机只需要登录
const CLOUD_DEFAULT={url:'',key:''};
let cloudCfg=JSON.parse(localStorage.getItem('liuyue-cloud')||'null')||CLOUD_DEFAULT;
let sess=JSON.parse(localStorage.getItem('liuyue-sess')||'null');
let syncState={s:'off',msg:'',at:+localStorage.getItem('liuyue-lastsync')||0},syncing=false;
const cloudReady=()=>!!(cloudCfg.url&&cloudCfg.key&&sess);
function setSess(d){sess=d&&d.access_token?{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(now()/1000)+(d.expires_in||3600),user:{id:d.user.id,email:d.user.email}}:null;localStorage.setItem('liuyue-sess',JSON.stringify(sess))}
async function api(path,{method='GET',body,headers={},raw=false,anon=false}={}){
  const h={apikey:cloudCfg.key,Authorization:'Bearer '+(!anon&&sess?sess.access_token:cloudCfg.key),...headers};
  if(body!==undefined&&!(body instanceof Blob)){h['Content-Type']='application/json';body=JSON.stringify(body)}
  const r=await fetch(cloudCfg.url.replace(/\/+$/,'')+path,{method,headers:h,body});
  if(!r.ok){let m=null;try{m=await r.json()}catch(e){};const e=new Error((m&&(m.msg||m.error_description||m.message||m.error))||('HTTP '+r.status));e.status=r.status;throw e}
  if(raw)return r;const t=await r.text();return t?JSON.parse(t):null;
}
async function ensureSession(){
  if(!sess)throw new Error('未登录');
  if(now()/1000>sess.expires_at-120){const d=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:sess.refresh_token},anon:true});setSess(d)}
}
function dataURLtoBlob(u){const [h,b]=u.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.match(/:(.*?);/)[1]})}
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function mergeState(a,b){
  const out={...a};
  for(const c of COLS){const m=new Map();for(const x of [...(a[c]||[]),...(b[c]||[])]){const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)}out[c]=[...m.values()]}
  for(const k of ['dog','careCfg'])out[k]=((b[k]&&b[k].u)||0)>((a[k]&&a[k].u)||0)?b[k]:a[k];
  return out;
}
function setSync(s,msg=''){syncState.s=s;syncState.msg=msg;if(s==='ok'){syncState.at=now();localStorage.setItem('liuyue-lastsync',syncState.at)}refreshCloudUI()}
async function syncNow(){
  if(!cloudReady()||syncing)return;syncing=true;setSync('busy');
  try{
    await ensureSession();const me=sess.user.id;
    const rows=await api(`/rest/v1/liuyue_docs?select=data&user_id=eq.${me}`);
    if(rows&&rows[0]&&rows[0].data)S=mergeState(S,rows[0].data);
    for(const p of S.photos){if(!p.del&&!p.cloud&&photoCache[p.id]){
      await api(`/storage/v1/object/photos/${me}/${p.id}.jpg`,{method:'POST',body:dataURLtoBlob(photoCache[p.id]),headers:{'x-upsert':'true','Content-Type':'image/jpeg'}});p.cloud=true;p.u=now()}}
    save(false);
    await api('/rest/v1/liuyue_docs',{method:'POST',body:{user_id:me,data:S,updated_at:new Date().toISOString()},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
    setSync('ok');renderAll();pullPhotos();
  }catch(e){if(e.status===401)setSess(null);setSync('err',e.message)}
  finally{syncing=false}
}
async function pullPhotos(){
  const me=sess&&sess.user.id;if(!me)return;let n=0;
  for(const p of live(S.photos)){if(p.cloud&&!photoCache[p.id]){try{const r=await api(`/storage/v1/object/authenticated/photos/${me}/${p.id}.jpg`,{raw:true});const d=await blobToDataURL(await r.blob());await dbPut(p.id,d);photoCache[p.id]=d;n++}catch(e){}}}
  if(n)renderAll();
}
async function signIn(){
  const email=val('cEmail'),pw=val('cPw');if(!email||pw.length<6)return toast('填邮箱和至少 6 位密码');
  try{setSync('busy');const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:pw},anon:true});setSess(d);toast('登录成功，正在同步');await syncNow()}
  catch(e){setSync('err',/confirm/i.test(e.message)?'邮箱还没确认：去邮箱点一下确认链接再登录':e.message)}
}
async function signUp(){
  const email=val('cEmail'),pw=val('cPw');if(!email||pw.length<6)return toast('填邮箱和至少 6 位密码');
  try{setSync('busy');const d=await api('/auth/v1/signup',{method:'POST',body:{email,password:pw},anon:true});
    if(d&&d.access_token){setSess(d);toast('注册成功，正在上传');await syncNow()}else setSync('off','确认邮件已发出：去邮箱点确认链接，再回来点「登录」')}
  catch(e){setSync('err',e.message)}
}
function signOut(){if(!confirm('退出后这台手机上的数据还在，只是不再同步。确定？'))return;setSess(null);setSync('off');renderAll()}
function saveCloudCfg(){const url=val('cUrl'),key=val('cKey');if(!/^https?:\/\//.test(url)||key.length<20)return toast('地址或 key 不对');cloudCfg={url,key};localStorage.setItem('liuyue-cloud',JSON.stringify(cloudCfg));renderAll();toast('已保存，现在可以登录')}
const SYNC_COL={off:'#E0D3DA',ok:'#7EDDB6',busy:'#FFD45E',err:'#FF6B6B'};
function cloudIcon(){
  const c=SYNC_COL[cloudReady()?syncState.s:'off'];
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="${c}" stroke="#3B2D3A" stroke-width="2" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.4 1.6A3.8 3.8 0 0 1 17.5 18z"/></svg>`;
}
function cloudPanel(){
  if(!cloudCfg.url||!cloudCfg.key)return `<div style="font-size:13px;font-weight:700;line-height:1.7;color:#6E5C6B;margin-bottom:12px">还没连上云端。建好 Supabase 项目后，把 Project URL 和 anon key 填进来。</div>
    <div class="field"><label>Project URL</label><input id="cUrl" placeholder="https://xxxx.supabase.co" autocapitalize="off"></div>
    <div class="field"><label>anon public key</label><input id="cKey" placeholder="eyJ..." autocapitalize="off"></div>
    <button class="submit" onclick="saveCloudCfg()">保存</button>`;
  if(!sess)return `<div style="font-size:13px;font-weight:700;line-height:1.7;color:${syncState.s==='err'?'#E5484D':'#6E5C6B'};margin-bottom:12px">${esc(syncState.msg)||'登录后记录和照片会自动上传。换手机、或者家人手机登录同一个账号，都能看到。'}</div>
    <div class="field"><label>邮箱</label><input id="cEmail" type="email" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label>密码（至少 6 位）</label><input id="cPw" type="password" autocomplete="current-password"></div>
    <div class="two"><button class="submit" onclick="signIn()">登录</button><button class="submit light" style="margin-top:6px" onclick="signUp()">第一次用，注册</button></div>`;
  const t=syncState.at?new Date(syncState.at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'还没同步过';
  const lbl={ok:'已同步',busy:'同步中…',err:'同步失败',off:'等待同步'}[syncState.s];
  return `<div class="cloud"><span class="st" style="background:${SYNC_COL[syncState.s]}"></span>
    <div style="flex:1;min-width:0"><b style="font-size:15px;font-weight:900">${lbl}</b><div style="font-size:12px;color:var(--sub);font-weight:700;overflow:hidden;text-overflow:ellipsis">${esc(sess.user.email)} · ${t}</div>${syncState.s==='err'?`<div style="font-size:12px;color:#E5484D;font-weight:800;margin-top:2px">${esc(syncState.msg)}</div>`:''}</div>
    <button class="chip" style="background:var(--bg);padding:8px 12px" onclick="syncNow()">立即同步</button></div>
    <div class="row" style="margin-top:8px;cursor:pointer" onclick="signOut()"><span>退出登录</span><b>›</b></div>`;
}
function refreshCloudUI(){
  const card=document.getElementById('cloudCard');
  if(card&&!(document.activeElement&&card.contains(document.activeElement)))card.innerHTML=cloudPanel();
  else if(card&&cloudReady())card.innerHTML=cloudPanel();
  const b=document.getElementById('cloudBtn');if(b)b.innerHTML=cloudIcon();
}

/* ===== 框架 ===== */
function sheet(html){const s=document.getElementById('sheet');s.innerHTML='<div class="grab"></div>'+html;s.scrollTop=0;s.classList.add('on');document.getElementById('mask').classList.add('on')}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.getElementById('mask').classList.remove('on');editing=null}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.p===p));document.getElementById('screen').scrollTop=0}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.p));
function renderAll(){renderHome();renderGrow();renderHealth();renderMe()}
if(firstVisit)save(false);
renderAll();
openDB().then(dbAll).then(all=>{photoCache=all;renderAll();syncNow()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
