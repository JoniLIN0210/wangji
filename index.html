<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="汪记">
<meta name="theme-color" content="#F4F6FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>汪记</title>
<style>
:root{
  --ink:#2B2D4A; --sub:#9195B2; --line:#EEF0F8; --bg:#F4F6FF; --card:#FFFFFF;
  --yellow:#FFDB5C; --pink:#FF9EC0; --blue:#8CC2FF; --mint:#7EE0B8; --lilac:#B9A8FF; --peach:#FFB38A;
  --r:28px;
  --round: ui-rounded,"SF Pro Rounded","PingFang SC",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--round);color:var(--ink);min-height:100vh;background:#EDF0FF;
  display:flex;align-items:center;justify-content:center;gap:60px;padding:32px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.6}
body:before{width:520px;height:520px;background:#FFE680;left:-120px;top:-140px}
body:after{width:560px;height:560px;background:#FFC3DA;right:-160px;bottom:-200px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* 左侧说明（只在电脑上显示） */
.intro{width:300px}
.intro .logo{display:flex;align-items:center;gap:12px;font-size:32px;font-weight:900}
.intro .logo i{width:56px;height:56px;border-radius:18px;overflow:hidden;display:block;transform:rotate(-6deg)}
.intro p{color:#5A5F80;font-size:14px;line-height:1.8;margin:18px 0 20px}
.intro ul{list-style:none;display:grid;gap:10px}
.intro li{background:rgba(255,255,255,.8);border-radius:16px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:center;line-height:1.5}
.intro li b{width:10px;height:10px;border-radius:50%;flex:none}
.intro .phone-tip{margin-top:16px;background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;font-size:13px;line-height:1.7}
.intro .phone-tip b{color:var(--yellow)}

/* 手机外框 */
.phone{width:390px;height:844px;border-radius:56px;position:relative;overflow:hidden;flex:none;
  background-color:var(--bg);background-image:radial-gradient(#E3E7FA 1.6px,transparent 1.6px);background-size:22px 22px;
  box-shadow:0 0 0 10px #fff,0 0 0 11px #DCE0F2,0 40px 80px -20px rgba(60,70,140,.35)}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font-size:15px;font-weight:700;z-index:30;background:linear-gradient(var(--bg) 60%,transparent)}
.status .notch{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#111}
.screen{position:absolute;inset:0;overflow-y:auto;padding:58px 20px 130px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.page{display:none;animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
.page.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* 手机上直接全屏 */
@media (max-width:520px){
  body{display:block;padding:0;background:var(--bg)}
  body:before,body:after,.intro,.status{display:none}
  .phone{position:fixed;inset:0;width:auto;height:auto;border-radius:0;box-shadow:none}
  .screen{padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:calc(env(safe-area-inset-bottom) + 120px)}
  .tabbar{bottom:calc(env(safe-area-inset-bottom) + 10px)!important}
  .sheet{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)!important}
  .toast{top:calc(env(safe-area-inset-top) + 12px)!important}
}

/* 通用 */
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}
.top h1{font-size:28px;font-weight:900;letter-spacing:.5px}
.top small{display:block;color:var(--sub);font-size:13px;font-weight:700;margin-bottom:2px}
.iconbtn{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;position:relative;box-shadow:0 4px 0 #E6E9F7}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E6E9F7}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#FF6B8B;border:2px solid #fff}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 5px 0 #E8EBF8}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px}
.sec h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:6px}
.sec button{font-size:13px;color:var(--sub);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* 首页 hero：小狗坐在卡片上 */
.hero{position:relative;padding-top:96px;margin-bottom:16px}
.mascot{position:absolute;right:6px;top:0;width:168px;height:168px;z-index:2;cursor:pointer}
.mascot.jump{animation:jump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0) scale(1.04,.96)}}
.bubble{position:absolute;left:2px;top:20px;max-width:190px;background:#fff;border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:13px;font-weight:800;line-height:1.5;z-index:3;box-shadow:0 4px 0 #E6E9F7;animation:float 3s ease-in-out infinite}
.bubble:after{content:"";position:absolute;right:-8px;top:18px;border:8px solid transparent;border-left-color:#fff}
@keyframes float{50%{transform:translateY(-4px)}}
.heart{position:absolute;z-index:5;pointer-events:none;animation:heart 1s ease-out forwards}
@keyframes heart{to{transform:translateY(-70px) scale(1.4);opacity:0}}
.hero-card{background:var(--yellow);border-radius:32px;padding:22px 20px 18px;position:relative;box-shadow:0 6px 0 #F0C63A}
.hero-card h2{font-size:38px;font-weight:900;line-height:1}
.hero-card .meta{display:flex;gap:6px;margin:10px 0 18px;flex-wrap:wrap}
.hero-card .meta span{background:rgba(255,255,255,.65);font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#fff;border-radius:20px;padding:10px 8px 9px;text-align:center}
.stats b{font-size:22px;font-weight:900;display:block;line-height:1.15}
.stats b small{font-size:11px;font-weight:800;margin-left:1px}
.stats span{font-size:11px;color:var(--sub);font-weight:700}
.anniv{display:flex;align-items:center;gap:12px;background:var(--pink);border-radius:26px;padding:14px 16px;margin-bottom:14px;box-shadow:0 5px 0 #F07DA4;position:relative;overflow:hidden}
.anniv .ic{width:44px;height:44px;border-radius:15px;background:#fff;display:grid;place-items:center;flex:none;transform:rotate(-8deg)}
.anniv p{flex:1;font-size:15px;font-weight:900}
.anniv p small{display:block;font-size:12px;opacity:.7;font-weight:700;margin-top:2px}
.anniv button{background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:9px 13px;border-radius:14px}
.confetti{position:absolute;inset:0;pointer-events:none;opacity:.5}

.remind{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.remind:last-child{border:0;padding-bottom:0}
.remind:first-child{padding-top:0}
.blob{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;flex:none}
.remind .tx{flex:1;min-width:0}
.remind .tx b{font-size:16px;font-weight:900;display:block}
.remind .tx span{font-size:12px;color:var(--sub);font-weight:600}
.done{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:.2s;flex:none}
.done:hover{background:#E5F9F0}
.done.stamp{animation:stamp .5s}
@keyframes stamp{40%{transform:scale(1.35) rotate(-12deg);background:var(--mint)}}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border-radius:26px;padding:16px;cursor:pointer;position:relative;overflow:hidden}
.mini .lb{font-size:12px;font-weight:800;opacity:.65}
.mini .val{font-size:28px;font-weight:900;margin:4px 0 4px}
.mini .val small{font-size:13px;margin-left:2px}

.strip{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ph{flex:none;width:124px;cursor:pointer;background:#fff;border-radius:20px;padding:7px 7px 10px;box-shadow:0 5px 0 #E8EBF8}
.ph:nth-child(odd){transform:rotate(-2deg)}.ph:nth-child(even){transform:rotate(2deg)}
.ph .img{width:110px;height:120px;border-radius:14px;overflow:hidden;background:#eee}
.ph .img img,.ph .img svg{width:100%;height:100%;object-fit:cover}
.ph p{font-size:12px;font-weight:800;margin:7px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph span{font-size:11px;color:var(--sub);font-weight:700;margin-left:3px}

/* 成长 */
.seg{display:flex;background:#fff;border-radius:20px;padding:5px;margin-bottom:18px;box-shadow:0 4px 0 #E8EBF8}
.seg button{flex:1;padding:10px 0;border-radius:15px;font-size:13px;font-weight:800;color:var(--sub);transition:.25s}
.seg button.on{background:var(--ink);color:#fff}
.smart{background:linear-gradient(135deg,#B9A8FF,#8CC2FF);border-radius:26px;padding:16px;color:#fff;display:flex;gap:12px;align-items:center;margin-bottom:12px;cursor:pointer;box-shadow:0 5px 0 #8E88E6}
.smart .ic{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.3);display:grid;place-items:center;flex:none}
.smart p{flex:1;font-weight:900;font-size:16px}
.smart p small{display:block;font-size:12px;font-weight:700;opacity:.9;margin-top:3px;line-height:1.5}
.compare-entry{background:#fff;border-radius:26px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 5px 0 #E8EBF8}
.compare-entry .pair{display:flex}
.compare-entry .pair div{width:52px;height:52px;border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.compare-entry .pair div:first-child{transform:rotate(-8deg)}
.compare-entry .pair div+div{margin-left:-12px;transform:rotate(8deg)}
.compare-entry .pair img,.compare-entry .pair svg{width:100%;height:100%;object-fit:cover}
.compare-entry p{flex:1;font-weight:900;font-size:15px}
.compare-entry p small{display:block;font-weight:700;font-size:12px;color:var(--sub);margin-top:3px}
.pol{background:#fff;border-radius:22px;padding:10px 10px 14px;position:relative;margin:0 6px 26px;box-shadow:0 6px 0 #E8EBF8}
.pol:nth-child(odd){transform:rotate(-1.4deg)}.pol:nth-child(even){transform:rotate(1.4deg)}
.pol:before{content:"";position:absolute;top:-10px;left:50%;width:74px;height:22px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);opacity:.85;border-radius:4px}
.pol .img{height:230px;border-radius:15px;overflow:hidden;background:#eee}
.pol .img img,.pol .img svg{width:100%;height:100%;object-fit:cover}
.pol .cap{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 6px 0;gap:8px}
.pol .cap b{font-size:15px;font-weight:900;display:block}
.pol .cap span{font-size:12px;color:var(--sub);font-weight:700}
.age-badge{position:absolute;right:-6px;top:20px;width:66px;height:66px;border-radius:50%;background:var(--c);display:grid;place-items:center;text-align:center;
  font-size:15px;font-weight:900;line-height:1.1;transform:rotate(10deg);border:3px solid #fff;box-shadow:0 4px 10px rgba(43,45,74,.12)}
.age-badge small{display:block;font-size:10px;font-weight:800;opacity:.7}
.stage-tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:9px;background:var(--c);flex:none}
.empty{text-align:center;color:var(--sub);font-size:14px;font-weight:700;padding:20px 0}
.empty div{width:150px;height:150px;margin:0 auto 6px}

/* 健康 */
.chart-card{background:#fff;border-radius:28px;padding:18px 18px 12px;box-shadow:0 5px 0 #E8EBF8}
.bigval{display:flex;align-items:baseline;gap:8px}
.bigval b{font-size:44px;font-weight:900}
.bigval .chip{background:#E5F9F0;color:#1E9E6A}
.range{display:flex;gap:6px;margin:10px 0 4px}
.range button{font-size:12px;font-weight:800;padding:7px 13px;border-radius:12px;color:var(--sub);background:var(--bg)}
.range button.on{background:var(--yellow);color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:2px dashed var(--line);font-size:14px;font-weight:700;gap:10px}
.row:last-child{border:0}
.row>span{color:var(--sub);font-size:13px;flex:none}
.care-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.care{background:#fff;border-radius:26px;padding:16px;position:relative;box-shadow:0 5px 0 #E8EBF8}
.care .ring{width:60px;height:60px;position:relative;margin-bottom:12px}
.care .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:900}
.care b{font-size:16px;font-weight:900;display:block}
.care small{font-size:12px;color:var(--sub);display:block;margin-top:3px;font-weight:700}
.care button{position:absolute;right:14px;top:14px;font-size:12px;font-weight:800;padding:7px 11px;border-radius:12px;background:var(--bg)}
.ill{background:#fff;border-radius:24px;padding:16px;margin-bottom:12px;display:flex;gap:12px;box-shadow:0 5px 0 #E8EBF8}
.ill .date{width:52px;flex:none;text-align:center;background:var(--bg);border-radius:16px;padding:8px 0;align-self:flex-start}
.ill .date b{font-size:19px;display:block;font-weight:900}
.ill .date span{font-size:11px;color:var(--sub);font-weight:700}
.ill .tx{flex:1}
.ill .tx b{font-size:15px;font-weight:900}
.ill .tx p{font-size:13px;color:#5A5F80;margin-top:5px;line-height:1.6;font-weight:600}
.bigbtn{width:100%;background:var(--ink);color:#fff;border-radius:20px;padding:16px;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;box-shadow:0 5px 0 #14152B}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #14152B}
.bigbtn.light{background:#fff;color:var(--ink);box-shadow:0 5px 0 #E8EBF8}

/* 档案 */
.idcard{border-radius:30px;padding:20px;position:relative;overflow:hidden;background:var(--blue);box-shadow:0 6px 0 #6AA4EE}
.idcard .hd{display:flex;justify-content:space-between;font-size:12px;font-weight:900;letter-spacing:2px;opacity:.75}
.idcard .bd{display:flex;gap:16px;margin-top:14px;align-items:center}
.idcard .av{width:100px;height:100px;border-radius:28px;background:#fff;overflow:hidden;flex:none;border:4px solid #fff;transform:rotate(-4deg)}
.idcard h2{font-size:32px;font-weight:900}
.idcard .f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.idcard .f div{font-size:13px;font-weight:800;background:rgba(255,255,255,.55);border-radius:14px;padding:8px 10px}
.idcard .f span{display:block;font-size:11px;font-weight:700;opacity:.6;margin-bottom:1px}
.idcard .bone{position:absolute;right:-18px;top:30px;opacity:.25;transform:rotate(-25deg)}
.family{display:flex;gap:14px;align-items:center}
.family div{text-align:center;font-size:12px;font-weight:800}
.family i{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;font-style:normal;font-size:19px;font-weight:900;margin-bottom:6px}
.family .add i{border:2.5px dashed #CDD1E4;color:var(--sub)}
.list .row{cursor:pointer}

/* 底部栏 */
.tabbar{position:absolute;left:14px;right:14px;bottom:24px;height:74px;border-radius:30px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-around;z-index:40;
  box-shadow:0 6px 0 #E3E6F5,0 14px 30px -10px rgba(40,50,110,.2)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#B0B4CB;width:58px}
.tab i{width:44px;height:32px;border-radius:13px;display:grid;place-items:center;transition:.3s cubic-bezier(.3,1.6,.5,1)}
.tab.on{color:var(--ink)}
.tab.on i{background:var(--yellow);transform:translateY(-2px)}
.tab.on svg{stroke:var(--ink)}
.fab{width:60px;height:60px;border-radius:22px;background:var(--pink);display:grid;place-items:center;margin-top:-30px;border:4px solid #fff;box-shadow:0 5px 0 #F07DA4;transition:.2s}
.fab:active{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 #F07DA4}

/* 弹层 */
.mask{position:absolute;inset:0;background:rgba(30,32,60,.35);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;z-index:60;padding:10px 22px 34px;
  transform:translateY(105%);transition:transform .4s cubic-bezier(.2,1.1,.3,1);max-height:90%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{display:flex;justify-content:center;margin-bottom:12px}
.sheet h3{font-size:22px;font-weight:900;margin-bottom:6px}
.sheet .hint{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:16px;line-height:1.6}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.types button{border-radius:22px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:900}
.types button:active{transform:scale(.94)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:0;background:var(--bg);border-radius:16px;padding:13px 14px;font-size:16px;font-weight:700;outline:none}
.field textarea{min-height:76px;resize:none}
.field input:focus,.field textarea:focus{box-shadow:0 0 0 2.5px var(--blue)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{padding:9px 14px;border-radius:14px;background:var(--bg);font-size:13px;font-weight:800}
.pills button.on{background:var(--ink);color:#fff}
.submit{width:100%;background:var(--ink);color:#fff;border-radius:20px;padding:16px;font-weight:900;font-size:16px;margin-top:6px;box-shadow:0 5px 0 #14152B}
.submit:active{transform:translateY(4px);box-shadow:0 1px 0 #14152B}
.upload{border:3px dashed #D5D9EA;border-radius:26px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;text-align:center;background:var(--bg)}
.upload b{color:var(--ink);font-size:16px;font-weight:900}
.upload .pup{width:96px;height:96px}
.kg{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:10px 0 18px}
.kg input{width:160px;text-align:center;font-size:56px;font-weight:900;border:0;outline:none;background:none}
.kg span{font-size:18px;font-weight:900;color:var(--sub)}

/* 识别结果 */
.det{background:var(--bg);border-radius:24px;padding:12px;margin-bottom:12px;display:flex;gap:12px;animation:pop .4s}
.det .th{width:86px;height:104px;border-radius:16px;overflow:hidden;flex:none;position:relative}
.det .th img{width:100%;height:100%;object-fit:cover}
.det .bd{flex:1;min-width:0}
.det .src{font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px}
.det .age{font-size:20px;font-weight:900;margin:5px 0 2px}
.det .age small{font-size:12px;font-weight:800;color:var(--sub);margin-left:4px}
.det .ex{font-size:12px;color:#5A5F80;font-weight:700;line-height:1.5}
.det .warn{font-size:12px;color:#E9573A;font-weight:800;margin-top:3px}
.det .ed{display:flex;gap:6px;margin-top:8px}
.det .ed input{min-width:0;flex:1;border:0;border-radius:12px;padding:8px 10px;font-size:16px;font-weight:700;background:#fff;outline:none}
.det .ed input[type=date]{flex:none;width:136px;font-size:14px}
.scanning{display:flex;align-items:center;gap:10px;justify-content:center;padding:18px;font-weight:800;color:var(--sub);font-size:14px}
.scanning i{width:10px;height:10px;border-radius:50%;background:var(--lilac);animation:bounce .6s infinite alternate}
.scanning i:nth-child(2){animation-delay:.2s;background:var(--pink)}.scanning i:nth-child(3){animation-delay:.4s;background:var(--yellow)}
@keyframes bounce{to{transform:translateY(-8px)}}

/* 对比 */
.cmp{position:relative;height:360px;border-radius:26px;overflow:hidden;user-select:none;touch-action:none}
.cmp .a,.cmp .b{position:absolute;inset:0}
.cmp img,.cmp svg{width:100%;height:100%;object-fit:cover}
.cmp .b{clip-path:inset(0 0 0 50%)}
.cmp .bar{position:absolute;top:0;bottom:0;left:50%;width:4px;background:#fff;transform:translateX(-50%)}
.cmp .bar i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;border:3px solid #fff}
.cmp .lab{position:absolute;bottom:12px;font-size:12px;font-weight:900;background:#fff;padding:6px 11px;border-radius:12px}
.cmp input{position:absolute;inset:0;opacity:0;cursor:ew-resize;width:100%;height:100%}

.summary{background:var(--bg);border-radius:22px;padding:16px;font-size:13px;line-height:1.9;font-weight:600}
.toast{position:absolute;left:50%;top:62px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;font-size:13px;font-weight:800;
  padding:11px 18px;border-radius:18px;z-index:90;opacity:0;transition:.35s cubic-bezier(.3,1.5,.5,1);pointer-events:none;white-space:nowrap;display:flex;gap:6px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 小狗动画 */
.live .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag .35s ease-in-out infinite alternate}
.live .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.live .head{transform-box:fill-box;transform-origin:50% 90%;animation:tilt 6s ease-in-out infinite}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes tilt{0%,70%,100%{transform:rotate(0)}78%,90%{transform:rotate(-6deg)}}
</style>
</head>

<script>
/* ================= 原创小狗插画 ================= */

      <ellipse cx="100" cy="112" rx="38" ry="25" fill="#fff"/>
      <g class="eyes"><ellipse cx="76" cy="88" rx="9" ry="10.5" fill="#2B2D4A"/><ellipse cx="124" cy="88" rx="9" ry="10.5" fill="#2B2D4A"/>
      <circle cx="79" cy="84" r="3.6" fill="#fff"/><circle cx="127" cy="84" r="3.6" fill="#fff"/><circle cx="73.5" cy="92" r="1.6" fill="#fff"/><circle cx="121.5" cy="92" r="1.6" fill="#fff"/></g>
      <path d="M91 101q9-6 18 0q-2 8-9 9q-7-1-9-9z" fill="#2B2D4A"/>
      <path d="M95 116q5 13 10 0z" fill="#FF7FA3"/>
      <path d="M100 110q-5 7-11 3M100 110q5 7 11 3" stroke="#2B2D4A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="62" cy="108" rx="10" ry="6" fill="#FF9EC0" opacity=".75"/><ellipse cx="138" cy="108" rx="10" ry="6" fill="#FF9EC0" opacity=".75"/>
      ${['hat','bow','glasses','flower'].includes(acc)?accs[acc]:''}
    </g>
    ${['scarf','ball','cake'].includes(acc)?accs[acc]:''}
  </g></svg>`;
}
const PRESETS = {
  p1:{bg:'#FFE3EE',puppy:true}, p2:{bg:'#DCEBFF',puppy:true,acc:'hat'}, p3:{bg:'#DDF7EC',puppy:true,acc:'bow'},
  p4:{bg:'#FFF2BF',acc:'ball'}, p5:{bg:'#FFE1D2',acc:'cake'}, p6:{bg:'#DCEBFF',acc:'glasses'},
  p7:{bg:'#ECE6FF',acc:'scarf'}, p8:{bg:'#DDF7EC',acc:'flower'}, p9:{bg:'#FFE3EE',acc:'bow'}, avatar:{bg:'#FFF2BF',acc:'bow'}

const photoHTML = p => (p.id&&photoCache[p.id]) ? `<img src="${photoCache[p.id]}" alt="">` : dog(PRESETS[p.preset]||{});

/* ================= 数据 ================= */

let S;
try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存失败，存储空间不够')}};

/* 照片原图存 IndexedDB，容量比 localStorage 大很多 */
let db;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('wangji',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function dbAll(){return new Promise(res=>{if(!db)return res({});const out={},tx=db.transaction('photos').objectStore('photos').openCursor();tx.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};tx.onerror=()=>res(out)})}
function dbPut(id,v){return new Promise(res=>{if(!db)return res();const t=db.transaction('photos','readwrite');t.objectStore('photos').put(v,id);t.oncomplete=res;t.onerror=res})}
function dbClear(){return new Promise(res=>{if(!db)return res();const t=db.transaction('photos','readwrite');t.objectStore('photos').clear();t.oncomplete=res})}
async function resetData(){await dbClear();photoCache={};S=seed();save();renderAll();closeSheet();toast('已恢复示例数据')}

/* ================= 工具 ================= */
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const days=(a,b)=>Math.round((b-a)/864e5);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const md=s=>{const d=P(s);return `${d.getMonth()+1}月${d.getDate()}日`};
const ymd=s=>s.replace(/-/g,'.');
function monthsBetween(a,b){let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return m}
function ageText(m){if(m<0)return '还没出生';const y=Math.floor(m/12),r=m%12;return y?`${y}岁${r?r+'个月':''}`:(r?`${r}个月`:'不到1个月')}
const ageAt=s=>monthsBetween(P(S.dog.birthday),P(s));
function stageOf(m){return m<6?{n:'幼犬期',c:'#FFC9DD'}:m<18?{n:'少年期',c:'#C6DEFF'}:{n:'成年期',c:'#BDEFD9'}}
const sortDesc=arr=>[...arr].sort((a,b)=>P(b.date)-P(a.date));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 双色图标：F 处填充颜色 */

  note:`<path d="M6.5 3.5h8.5l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1.5-1.5z" fill="F"/><path d="M9 12h6M9 16h4"/>`,
  check:`<path d="m6 12.5 4 4 8-9"/>`,

  heart:`<path d="M12 20s-8-4.6-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.4 12 20 12 20z" fill="F"/>`,

/* ================= 图表 ================= */
function chart(data,W,H,{axis=true,color='#8CC2FF'}={}){
  if(data.length<2) return '';
  const pad=axis?{l:30,r:12,t:16,b:24}:{l:4,r:6,t:8,b:4};
  const xs=data.map(d=>P(d.date).getTime()), ys=data.map(d=>d.kg);
  let mn=Math.min(...ys), mx=Math.max(...ys); const sp=(mx-mn)||1; mn-=sp*.15; mx+=sp*.15;
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const X=t=>pad.l+(t-x0)/(x1-x0||1)*(W-pad.l-pad.r), Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(H-pad.t-pad.b);
  const pts=data.map(d=>[X(P(d.date).getTime()),Y(d.kg)]);
  let path=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[c,d]=pts[i],m=(a+c)/2;path+=` C${m},${b} ${m},${d} ${c},${d}`}
  const id='g'+Math.random().toString(36).slice(2,7);
  let g='';
  if(axis){
    for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" stroke="#EEF0F8" stroke-width="2" stroke-dasharray="4 5"/><text x="0" y="${y+4}" font-size="10" font-weight="700" fill="#B0B4CB">${v.toFixed(1)}</text>`}
    const f=P(data[0].date),l=P(data[data.length-1].date);
    g+=`<text x="${pad.l}" y="${H-4}" font-size="10" font-weight="700" fill="#B0B4CB">${f.getFullYear()}.${f.getMonth()+1}</text><text x="${W-pad.r}" y="${H-4}" font-size="10" font-weight="700" fill="#B0B4CB" text-anchor="end">${l.getFullYear()}.${l.getMonth()+1}</text>`;
  }
  const last=pts[pts.length-1];
  return `<svg width="100%" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}
  <path d="${path} L${last[0]},${H-pad.b} L${pts[0][0]},${H-pad.b}Z" fill="url(#${id})"/>
  <path d="${path}" fill="none" stroke="${color}" stroke-width="${axis?4:3}" stroke-linecap="round"/>
  ${axis?`<g transform="translate(${last[0]-9} ${last[1]-9})">${paw(18,'#2B2D4A')}</g>`:`<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"/>`}</svg>`;
}
function ring(p,color,size=60){
  const r=size/2-6,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(1,p)));
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#F1F2F9" stroke-width="9" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg>`;
}

}

/* ================= 智能识别拍摄时间 ================= */
// 读 JPEG 里的 EXIF：DateTimeOriginal(0x9003) > DateTimeDigitized(0x9004) > DateTime(0x0132)
function exifDate(buf){
  try{
    const v=new DataView(buf); if(v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while(o<v.byteLength-10){
      const m=v.getUint16(o); if((m&0xFF00)!==0xFF00) return null;
      const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966) return tiffDate(v,o+10);
      if(m===0xFFDA) return null;
      o+=2+len;
    }
  }catch(e){}
  return null;
}
function tiffDate(v,t){
  const le=v.getUint16(t)===0x4949, g16=p=>v.getUint16(p,le), g32=p=>v.getUint32(p,le);
  const ifd=off=>{const n=g16(t+off),tags={};for(let i=0;i<n;i++){const e=t+off+2+i*12;tags[g16(e)]={count:g32(e+4),at:e+8}}return tags};
  const str=tag=>{if(!tag)return null;const p=tag.count>4?t+g32(tag.at):tag.at;let s='';for(let i=0;i<tag.count-1;i++)s+=String.fromCharCode(v.getUint8(p+i));return s};
  const i0=ifd(g32(t+4)); let d=null;
  if(i0[0x8769]){const ex=ifd(g32(i0[0x8769].at));d=str(ex[0x9003])||str(ex[0x9004])}
  d=d||str(i0[0x0132]);
  const m=d&&d.match(/^(\d{4}):(\d{2}):(\d{2})/);
  return m&&+m[1]>1990?`${m[1]}-${m[2]}-${m[3]}`:null;
}
// 没有 EXIF 时，从文件名里找日期，比如 IMG_20240312_101500.jpg、Screenshot_2024-03-12
function nameDate(n){
  const m=n.match(/(20\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])/);
  return m?`${m[1]}-${m[2]}-${m[3]}`:null;
}
function suggestCaption(date){
  const d=P(date), b=P(S.dog.birthday), h=P(S.dog.home);
  if(date===S.dog.home) return '到家第一天';
  if(d.getMonth()===b.getMonth()&&d.getDate()===b.getDate()&&d>b) return `${d.getFullYear()-b.getFullYear()} 岁生日`;
  if(d.getMonth()===h.getMonth()&&d.getDate()===h.getDate()&&d>h) return `到家 ${d.getFullYear()-h.getFullYear()} 周年`;
  return '';
}
function shrink(file){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const c=document.createElement('canvas'),sc=Math.min(1,1000/Math.max(im.width,im.height));c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url});
}
async function handleFiles(files){
  const list=document.getElementById('detList');
  list.innerHTML=`<div class="scanning"><i></i><i></i><i></i>正在看照片是什么时候拍的</div>`;
  pending=[];
  for(const f of files){
    let date=null, source='none';
    try{date=exifDate(await f.slice(0,262144).arrayBuffer());if(date)source='exif'}catch(e){}
    if(!date){date=nameDate(f.name);if(date)source='name'}
    let src=null;try{src=await shrink(f)}catch(e){}
    if(!src){toast(`${f.name} 打不开`);continue}
    pending.push({src,date:date||fmt(TODAY),source,caption:suggestCaption(date||'')});
  }
  pending.sort((a,b)=>P(a.date)-P(b.date));
  renderPending();
}
function detInfo(p){
  const m=ageAt(p.date), st=stageOf(m), w=weightNear(p.date), d=P(p.date);
  let warn='';
  if(d>TODAY) warn='这个日期在未来，改一下吧';
  else if(m<0) warn=`那时${S.dog.name}还没出生，日期对吗？`;
  else if(d<P(S.dog.home)) warn='这是到家之前的照片';
  return {m,st,w,warn};
}
const SRC={exif:['照片信息里读到的','#DDF7EC','#1E9E6A'],name:['从文件名里读到的','#DCEBFF','#3E7FD6'],none:['没读到，请选一下日期','#FFE4DA','#E9573A']};
function renderPending(){
  const list=document.getElementById('detList'); if(!list) return;
  if(!pending.length){list.innerHTML='';return}
  const ok=pending.filter(p=>p.source!=='none').length;
  list.innerHTML=`<div style="font-size:13px;font-weight:800;margin:0 2px 10px">${pending.length} 张照片，${ok} 张自动认出了日期</div>`+
  pending.map((p,i)=>{const x=detInfo(p),s=SRC[p.source];return `
    <div class="det"><div class="th"><img src="${p.src}"></div>
      <div class="bd">
        <span class="src" style="background:${s[1]};color:${s[2]}">${s[0]}</span>
        <div class="age">${x.m<0?'出生前':ageText(x.m)}<small>${x.m<0?'':x.st.n}</small></div>
        <div class="ex">${ymd(p.date)}${x.w?` · 那时大约 ${x.w} kg`:''}</div>
        ${x.warn?`<div class="warn">${x.warn}</div>`:''}
        <div class="ed"><input type="date" value="${p.date}" onchange="pending[${i}].date=this.value;pending[${i}].source=pending[${i}].source==='none'?'none':pending[${i}].source;if(!pending[${i}].caption)pending[${i}].caption=suggestCaption(this.value);renderPending()"></div>
        <div class="ed"><input placeholder="写一句（可不写）" value="${esc(p.caption)}" oninput="pending[${i}].caption=this.value"></div>
      </div></div>`}).join('')+
  `<button class="submit" onclick="savePending()">放进相册</button>`;
}
async function savePending(){
  for(const p of pending){
    const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await dbPut(id,p.src); photoCache[id]=p.src;
    S.photos.push({id,date:p.date,caption:p.caption||'新的一天'});
  }
  const n=pending.length; pending=[]; save(); closeSheet(); growFilter='all'; renderAll(); go('grow'); toast(`${n} 张照片已按月龄放好`);
}
